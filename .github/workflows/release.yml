name: Build and release SupaClean for Windows
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: smartclean-release
  cancel-in-progress: false
jobs:
  build-release:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Set release version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'src/SmartClean.WinUI/SmartClean.WinUI.csproj'
          $base = [version]$project.Project.PropertyGroup.Version
          $revision = [int]'${{ github.run_number }}'
          if ($revision -lt 1 -or $revision -gt 65000) { throw 'Run number exceeds supported assembly version range.' }
          $version = "$($base.Major).$($base.Minor).$($base.Build).$revision"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building SupaClean $version for commit $env:GITHUB_SHA"
      - name: Restore
        shell: pwsh
        run: >-
          dotnet restore src/SmartClean.WinUI/SmartClean.WinUI.csproj
          --configfile NuGet.Config -r win-x64 -p:SmartCleanTargetFramework=net10.0
          -p:Platform=x64 -p:EnableMsixTooling=true -p:WindowsAppSDKSelfContained=true
          -p:SelfContained=true
      - name: Test core safeguards
        shell: pwsh
        run: >-
          dotnet run --project tests/SmartClean.Core.Tests/SmartClean.Core.Tests.csproj
          --configuration Release -p:SmartCleanTargetFramework=net10.0
      - name: Publish unpackaged WinUI
        shell: pwsh
        run: >-
          dotnet publish src/SmartClean.WinUI/SmartClean.WinUI.csproj
          --no-restore --configuration Release --runtime win-x64 --self-contained true
          -p:SmartCleanTargetFramework=net10.0 -p:Platform=x64 -p:EnableMsixTooling=true
          -p:WindowsAppSDKSelfContained=true -p:PublishTrimmed=false -p:PublishAot=false
          -p:PublishReadyToRun=false -p:PublishSingleFile=false
          -p:Version=${{ steps.version.outputs.version }}
          --output output/SmartClean-win-x64
      - name: Verify compiled assembly version
        shell: pwsh
        run: |
          $dll = (Resolve-Path 'output/SmartClean-win-x64/SmartClean.WinUI.dll').Path
          $actual = [System.Reflection.AssemblyName]::GetAssemblyName($dll).Version.ToString()
          $expected = '${{ steps.version.outputs.version }}'
          if ($actual -ne $expected) { throw "Compiled version $actual does not match release version $expected." }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Create single EXE installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup was not installed at: $iscc" }
          $publish = (Resolve-Path "output/SmartClean-win-x64").Path
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "/DBuildOutput=$publish" "installer/SmartClean.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "output/releases/SmartClean-Setup.exe")) { throw "Installer not created" }
      - name: Publish one verified EXE for newest main commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main --quiet
          $head = (git rev-parse origin/main).Trim()
          $built = (git rev-parse HEAD).Trim()
          if ($head -ne $built) {
            Write-Host "::notice::A newer source commit is available: $head. Skipping obsolete build $built."
            exit 0
          }
          $tag = '${{ steps.version.outputs.tag }}'
          gh release create "$tag" 'output/releases/SmartClean-Setup.exe' --target "$built" --title "SupaClean $tag" --notes "Automatically compiled from main ($built). Safety tests passed. SupaClean is the new display name. The single setup EXE retains its previous filename so installed SmartClean clients can update seamlessly; user approval remains required." --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publishing failed.' }
